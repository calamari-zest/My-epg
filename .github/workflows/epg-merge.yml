name: Merge EPG

on:
  schedule:
    # Runs every day at 8am UTC — adjust the cron if you want a
    # different time. Guide data usually only needs a daily refresh.
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run merge script
        run: python merge_epg.py

      - name: Commit updated guide
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml
          git diff --quiet --cached || git commit -m "Auto-update guide.xml"
          git push
